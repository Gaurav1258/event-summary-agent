steps:
  # Step 1: Build the container image using Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/event-summary-agent:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/event-summary-agent:latest'
      - '.'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/event-summary-agent:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/event-summary-agent:latest'

  # Step 3: Deploy the image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'event-summary-agent'
      - '--image=gcr.io/$PROJECT_ID/event-summary-agent:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=us-central1'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300s'

# Images to be stored in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/event-summary-agent:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/event-summary-agent:latest'

options:
  logging: CLOUD_LOGGING_ONLY
